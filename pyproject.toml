[project]
name = "karak"
version = "0.1.0"
description = "An experimental Python ASGI framework with typed routing and validation."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Fauzan", email = "im.external@pm.me" }
]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Homepage = "https://github.com/grandimam/karak"
Source = "https://github.com/grandimam/karak"
Issues = "https://github.com/grandimam/karak/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karak"]

[dependency-groups]
dev = [
    "py-spy>=0.4.2",
    "uvicorn>=0.52.4",
]
