site_name: Karak
site_description: Learn to build Python backends with Karak, from your first endpoint to typed inputs, request context, shared resources, and tested application lifecycles.
site_url: https://karak.dev/
repo_url: https://github.com/grandimam/karak
docs_dir: content
site_dir: dist
use_directory_urls: true
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html
plugins:
  - search:
      indexing: sections
markdown_extensions:
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: false
nav:
  - Getting started:
      - Hello World: index.md
      - Installation: installation.md
      - Endpoints and methods: endpoints.md
      - How requests work: introduction.md
  - Requests and responses:
      - Path and query parameters: parameters.md
      - Responses and errors: responses.md
      - Headers, cookies, and context: request-context.md
  - Building applications:
      - Project layout: project-layout.md
      - Routers and modules: routing.md
      - Shared resources: resources.md
      - Application lifecycle: application.md
      - Testing: testing.md
  - Reference:
      - Benchmarks: benchmarks.md
      - Mission: design.md
