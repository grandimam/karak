site_name: Karak
site_description: Learn to build Python backends with Karak, from your first endpoint to typed inputs, request context, shared resources, and tested application lifecycles.
site_url: https://karak.dev/
repo_url: https://github.com/grandimam/karak
docs_dir: content
site_dir: dist
use_directory_urls: true
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html
plugins:
  - search:
      indexing: sections
markdown_extensions:
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: false
nav:
  - Getting started:
      - Quickstart: index.md
      - Your first week: first-week.md
      - Installation: installation.md
      - How Karak works: introduction.md
  - Using Karak:
      - Run an application: application.md
      - Define routes: routing.md
      - Read request values: parameters.md
      - Headers, cookies, and context: request-context.md
      - Send responses: responses.md
      - Share application resources: resources.md
  - About:
      - Benchmarks: benchmarks.md
      - Mission: design.md
