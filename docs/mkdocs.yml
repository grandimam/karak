site_name: Karak
site_description: Learn to build Python backends with Karak, from your first endpoint to typed inputs, request context, shared resources, and tested application lifecycles.
site_url: https://karak.dev/
repo_url: https://github.com/grandimam/karak
docs_dir: content
site_dir: dist
use_directory_urls: true
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html
plugins:
  - search:
      indexing: sections
markdown_extensions:
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: false
nav:
  - Learning path:
      - Curriculum: curriculum.md
      - Installation: installation.md
      - First-week schedule: first-week.md
  - "Part 1 · Your first HTTP app":
      - "1. Hello World": index.md
      - "2. Endpoints and methods": endpoints.md
      - "3. Follow a request": introduction.md
  - "Part 2 · Requests and responses":
      - "4. Path and query parameters": parameters.md
      - "5. Responses and errors": responses.md
      - "6. Request context": request-context.md
  - "Part 3 · Structure and reliability":
      - "7. Routers and modules": routing.md
      - "8. Shared resources": resources.md
      - "9. Application lifecycle": application.md
      - "10. Test your backend": testing.md
  - Reference:
      - Benchmarks: benchmarks.md
      - Mission: design.md
