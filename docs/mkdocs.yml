site_name: Karak
site_description: Python backend development should be integrated, not assembled. Learn the fundamentals. Learn Karak deeply. One coherent system to build and operate Python backends.
site_url: https://karak.dev/
repo_url: https://github.com/grandimam/karak
docs_dir: content
site_dir: dist
use_directory_urls: true
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html
plugins:
  - search:
      indexing: sections
markdown_extensions:
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: false
nav:
  - Getting started:
      - Introduction: introduction.md
      - Quickstart: index.md
      - Installation: installation.md
  - Using Karak:
      - Run an application: application.md
      - Define routes: routing.md
      - Read request values: parameters.md
      - Send responses: responses.md
  - Looking ahead:
      - Thesis and direction: design.md
