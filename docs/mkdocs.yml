site_name: Karak
site_description: Build Python HTTP applications with Karak. Run your first endpoint, validate inputs, share application resources, and send responses.
site_url: https://karak.dev/
repo_url: https://github.com/grandimam/karak
docs_dir: content
site_dir: dist
use_directory_urls: true
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html
plugins:
  - search:
      indexing: sections
markdown_extensions:
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: false
nav:
  - Getting started:
      - Quickstart: index.md
      - Installation: installation.md
      - How Karak works: introduction.md
  - Using Karak:
      - Run an application: application.md
      - Define routes: routing.md
      - Read request values: parameters.md
      - Send responses: responses.md
      - Share application resources: resources.md
  - About:
      - Mission: design.md
